name: Tests

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # checkout only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Same .venv layout as local development, so the prek hooks resolve identically.
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements_test.txt

      - name: Run linters (prek, same hooks as the git hook)
        run: .venv/bin/prek run --all-files --show-diff-on-failure --hook-stage manual
        env:
          SKIP: no-commit-to-branch

      - name: Run tests with branch coverage
        run: |
          .venv/bin/coverage erase
          .venv/bin/coverage run -m pytest -q
          .venv/bin/coverage report
